name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application entry points
        run: |
          python -m py_compile app.py pages/*.py model/*.py ui/*.py

      - name: Run tests
        run: pytest -q

      - name: Smoke test Streamlit startup
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill "$STREAMLIT_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8501/_stcore/health"
          last_error = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and "ok" in body.lower():
                          print("Streamlit health check passed:", body.strip())
                          raise SystemExit(0)
              except Exception as exc:  # startup may not be ready yet
                  last_error = exc
              time.sleep(0.5)
          raise SystemExit(f"Streamlit health check failed: {last_error}")
          PY
          kill "$STREAMLIT_PID" 2>/dev/null || true
          wait "$STREAMLIT_PID" 2>/dev/null || true
          trap - EXIT
        continue-on-error: false

      - name: Print Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
